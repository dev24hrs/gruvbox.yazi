# Gogh Gruvbox Dark (https://gogh.website) flavor for Yazi.
# Palette source: Gogh-Co/Gogh themes/Gruvbox Dark.yml
#
#   bg0 #282828  bg1 #3c3836  bg2 #504945  bg4 #7c6f64
#   gray #928374  fg4 #a89984  fg2 #d5c4a1  fg1 #ebdbb2
#   red #fb4934  green #b8bb26  yellow #fabd2f
#   blue #83a598  magenta #d3869b  aqua #8ec07c  orange #fe8019
#
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#b8bb26" }

# Find
find_keyword = { fg = "#fabd2f", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#83a598", italic = true }

# Marker
marker_copied = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut = { fg = "#fb4934", bg = "#fb4934" }
marker_marked = { fg = "#8ec07c", bg = "#8ec07c" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }

# Count
count_copied = { fg = "#282828", bg = "#b8bb26" }
count_cut = { fg = "#282828", bg = "#fb4934" }
count_selected = { fg = "#282828", bg = "#fabd2f" }

# Border
border_style = { fg = "#928374" }

# : }}}

# : Tabs {{{

[tabs]
active = { fg = "#282828", bg = "#83a598", bold = true }
inactive = { fg = "#83a598", bg = "#3c3836" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#83a598", bold = true }
normal_alt = { fg = "#83a598", bg = "#3c3836" }

# Select mode
select_main = { fg = "#282828", bg = "#b8bb26", bold = true }
select_alt = { fg = "#b8bb26", bg = "#3c3836" }

# Unset mode
unset_main = { fg = "#282828", bg = "#fb4934", bold = true }
unset_alt = { fg = "#fb4934", bg = "#3c3836" }

# : }}}

# : Indicator {{{

[indicator]
parent = {}
current = { bg = "#504945" }
preview = { fg = "#8ec07c" }

# : }}}

# : Status bar {{{

[status]
# Permissions
perm_sep = { fg = "#928374" }
perm_type = { fg = "#83a598" }
perm_read = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec = { fg = "#b8bb26" }

# Progress
progress_label = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#b8bb26", bg = "#3c3836" }
progress_error = { fg = "#fabd2f", bg = "#fb4934" }

# : }}}

# : Which {{{

[which]
border = { fg = "#83a598" }
mask = { bg = "#3c3836" }
cand = { fg = "#b8bb26" }
rest = { fg = "#a89984" }
desc = { fg = "#d3869b" }
separator_style = { fg = "#7c6f64" }

# : }}}

# : Confirmation {{{

[confirm]
border = { fg = "#83a598" }
title = { fg = "#83a598" }
body = {}
list = {}
btn_yes = { reversed = true, bold = true }
btn_no = {}

# : }}}

# : Spotter {{{

[spot]
border = { fg = "#83a598" }
title = { fg = "#83a598" }

# Table
tbl_col = { fg = "#b8bb26" }
tbl_cell = { fg = "#d3869b", bg = "#504945" }

# : }}}

# : Notification {{{

[notify]
title_info = { fg = "#b8bb26" }
title_warn = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

# : }}}

# : Picker {{{

[pick]
border = { fg = "#83a598" }
active = { fg = "#d3869b", bold = true }
inactive = {}

# : }}}

# : Input {{{

[input]
border = { fg = "#83a598" }
title = {}
value = {}
selected = { reversed = true }

# : }}}

# : Completion {{{

[cmp]
border = { fg = "#83a598" }
active = { reversed = true }
inactive = {}

# : }}}

# : Task manager {{{

[tasks]
border = { fg = "#83a598" }
title = {}
hovered = { fg = "#d3869b", bold = true }

# : }}}

# : Help menu {{{

[help]
border = { fg = "#83a598" }
chord = { fg = "#8ec07c" }
action = {}
hovered = { reversed = true, bold = true }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
  # Image
  { mime = "**/image/*", fg = "#b8bb26" },
  # Media
  { mime = "**/{audio,video}/*", fg = "#fabd2f" },
  # Archive
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3869b" },
  # Document
  { mime = "**/application/{pdf,doc,rtf}", fg = "#8ec07c" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#a89984" },
  # Special files
  { url = "*", is = "orphan", fg = "#fb4934" },
  { url = "*", is = "exec", fg = "#b8bb26" },
  { url = "*", is = "dummy", fg = "#fb4934" },
  # Fallback
  { url = "*/", fg = "#83a598" },
  { url = "*", fg = "#ebdbb2" },
]

# : }}}

# : Icons {{{

[icon]
# Regular-file icon colors. The built-in preset's `files`/`exts` rules use
# devicons colors which are low-contrast on gruvbox backgrounds (e.g. `sh`
# is #4d5a5e, README's light-mode color is #2f2f2f). Override with the
# gruvbox palette so the icons stay readable in both dark and light presets.
prepend_exts = [
  # Shell scripts
  { name = "sh",   text = "", fg = "#fe8019" },
  { name = "bash", text = "", fg = "#fe8019" },
  { name = "zsh",  text = "", fg = "#fe8019" },
  { name = "fish", text = "", fg = "#fe8019" },
  { name = "ksh",  text = "", fg = "#fe8019" },
  { name = "csh",  text = "", fg = "#fe8019" },
  { name = "nu",   text = "", fg = "#fe8019" },
  # Markdown
  { name = "md", text = "", fg = "#83a598" },
  # Config files
  { name = "toml",     text = "", fg = "#d3869b" },
  { name = "yaml",     text = "", fg = "#8ec07c" },
  { name = "yml",      text = "", fg = "#8ec07c" },
  { name = "conf",     text = "", fg = "#8ec07c" },
  { name = "config",   text = "", fg = "#8ec07c" },
  { name = "ini",      text = "", fg = "#8ec07c" },
  { name = "makefile", text = "", fg = "#8ec07c" },
  { name = "mk",       text = "", fg = "#8ec07c" },
]

prepend_files = [
  { name = "readme",    text = "󰂺", fg = "#fabd2f" },
  { name = "readme.md", text = "󰂺", fg = "#fabd2f" },
  { name = "license",   text = "", fg = "#fabd2f" },
  { name = "config",    text = "", fg = "#8ec07c" },
  { name = "makefile",  text = "", fg = "#8ec07c" },
]

dirs = [
  { name = ".config", text = "", fg = "#d3869b" },
  { name = ".git", text = "", fg = "#b8bb26" },
  { name = ".github", text = "", fg = "#83a598" },
  { name = ".npm", text = "", fg = "#83a598" },
  { name = "Desktop", text = "", fg = "#8ec07c" },
  { name = "Development", text = "", fg = "#8ec07c" },
  { name = "Documents", text = "", fg = "#8ec07c" },
  { name = "Downloads", text = "", fg = "#8ec07c" },
  { name = "Library", text = "", fg = "#8ec07c" },
  { name = "Movies", text = "", fg = "#8ec07c" },
  { name = "Music", text = "", fg = "#8ec07c" },
  { name = "Pictures", text = "", fg = "#8ec07c" },
  { name = "Public", text = "", fg = "#8ec07c" },
  { name = "Videos", text = "", fg = "#8ec07c" },
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#d5c4a1" },
  { if = "link", text = "", fg = "#928374" },
  { if = "block", text = "", fg = "#fb4934" },
  { if = "char", text = "", fg = "#fb4934" },
  { if = "fifo", text = "", fg = "#fb4934" },
  { if = "sock", text = "", fg = "#fb4934" },
  { if = "sticky", text = "", fg = "#fb4934" },
  { if = "dummy", text = "", fg = "#fb4934" },

  # Fallback
  { if = "dir", text = "", fg = "#83a598" },
  { if = "exec", text = "", fg = "#b8bb26" },
  { if = "!dir", text = "", fg = "#ebdbb2" },
]

# : }}}
